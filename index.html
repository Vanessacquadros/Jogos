<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Espaço Louvor & Ação</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --accent: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 1.5rem;
            width: 100%;
            max-width: 500px;
        }

        h1 {
            font-size: 1.5rem;
            background: linear-gradient(to right, #c084fc, #f43f5e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-tabs {
            display: flex;
            gap: 0.5rem;
            width: 100%;
            max-width: 500px;
            margin-bottom: 1rem;
            background: var(--bg-card);
            padding: 0.35rem;
            border-radius: 12px;
        }

        .tab-btn {
            flex: 1;
            padding: 0.75rem;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--accent);
            color: white;
        }

        .game-container {
            display: none;
            width: 100%;
            max-width: 500px;
            background: var(--bg-card);
            border-radius: 16px;
            padding: 1.25rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            animation: fadeIn 0.3s ease;
        }

        .game-container.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .rules-box {
            background: rgba(15, 23, 42, 0.6);
            border-left: 3px solid var(--accent);
            padding: 0.75rem;
            border-radius: 0 8px 8px 0;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        /* --- ROLETA VISUAL CORRIGIDA --- */
        .roulette-wrapper {
            position: relative;
            width: 240px;
            height: 240px;
            margin: 0 auto 1.5rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .roulette-pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-bottom: 20px solid #f43f5e;
            z-index: 10;
        }

        .roulette-wheel {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border-radius: 50%;
            /* Fatias coloridas da roleta */
            background: conic-gradient(
                #8b5cf6 0deg 60deg,
                #6d28d9 60deg 120deg,
                #f43f5e 120deg 180deg,
                #be123c 180deg 240deg,
                #38bdf8 240deg 300deg,
                #0369a1 300deg 360deg
            );
            transition: transform 3s cubic-bezier(0.15, 0.90, 0.15, 1);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
        }

        /* O centro que não gira e mantém o texto reto */
        .roulette-center {
            position: relative;
            z-index: 5;
            width: 150px;
            height: 150px;
            background: var(--bg-primary);
            border: 4px solid var(--bg-card);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .word-display {
            font-size: 1.2rem;
            font-weight: 700;
            text-align: center;
            padding: 0.5rem;
            color: #fff;
        }

        /* --- BOTÕES --- */
        .btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.1s;
        }
        
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: var(--accent); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-warning { background: var(--warning); color: #000; }

        /* --- MÍMICAS --- */
        .timer-display {
            font-size: 3rem;
            font-weight: 800;
            text-align: center;
            color: #f43f5e;
            margin: 0.5rem 0;
            font-variant-numeric: tabular-nums;
        }

        .secret-word {
            font-size: 1.5rem;
            font-weight: 700;
            color: #38bdf8;
            text-align: center;
            margin: 1.5rem 0;
            min-height: 2.5rem;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        
        .full-width { grid-column: span 2; }

        .score-board {
            display: flex;
            justify-content: space-between;
            background: rgba(0,0,0,0.2);
            padding: 0.8rem;
            border-radius: 8px;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎮 Festança Gospel</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Diversão garantida para a célula</p>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab(0)">1 Palavra, 1 Música</button>
        <button class="tab-btn" onclick="switchTab(1)">Mímicas</button>
    </div>

    <!-- JOGO 1: ROLETA -->
    <div class="game-container active" id="game-1">
        <div class="rules-box">
            Gire a roleta. O grupo tem 30 segundos para lembrar e cantar um louvor que contenha a palavra sorteada.
        </div>
        
        <div class="roulette-wrapper">
            <div class="roulette-pointer"></div>
            <!-- O fundo que gira -->
            <div class="roulette-wheel" id="wheel"></div>
            <!-- O centro que fica parado -->
            <div class="roulette-center">
                <div class="word-display" id="currentWord">Gire!</div>
            </div>
        </div>

        <button class="btn btn-primary" id="spinBtn" onclick="spinRoulette()">Girar Roleta 🎯</button>
    </div>

    <!-- JOGO 2: MÍMICAS -->
    <div class="game-container" id="game-2">
        <div class="rules-box">
            Faça a mímica do personagem ou história bíblica. É proibido emitir sons ou apontar para objetos.
        </div>

        <div class="timer-display" id="timer">60</div>
        <div class="secret-word" id="secretWord">Clique em Iniciar</div>

        <div class="controls-grid">
            <button class="btn btn-primary full-width" id="startMimicBtn" onclick="startNewMimic()">Sortear / Iniciar 🎭</button>
            
            <button class="btn btn-warning full-width" id="pauseBtn" onclick="togglePause()" style="display: none;">Pausar Tempo ⏸️</button>
            
            <button class="btn btn-success" id="btnHit" onclick="adjustScore(1)" disabled>Acertou ✅</button>
            <button class="btn btn-danger" id="btnPass" onclick="adjustScore(0)" disabled>Passar ❌</button>
        </div>

        <div class="score-board">
            <span>Acertos:</span>
            <strong id="scoreVal" style="color: #fff; font-size: 1.1rem;">0</strong>
        </div>
    </div>

    <script>
        // --- NAVEGAÇÃO DE ABAS ---
        function switchTab(index) {
            document.querySelectorAll('.game-container').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });
            document.querySelectorAll('.tab-btn').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });
        }

        // --- LÓGICA DA ROLETA (JOGO 1) ---
        const gospelWords = [
            "Graça", "Amor", "Cruz", "Fé", "Sangue", 
            "Fogo", "Cordeiro", "Leão", "Paz", "Glória", 
            "Santo", "Milagre", "Caminho", "Deserto", "Luz", "Céu"
        ];
        
        let isSpinning = false;
        let currentRotation = 0;

        function spinRoulette() {
            if (isSpinning) return;
            isSpinning = true;
            
            const wheel = document.getElementById('wheel');
            const wordEl = document.getElementById('currentWord');
            const btn = document.getElementById('spinBtn');
            
            btn.disabled = true;
            wordEl.textContent = "...";
            wordEl.style.fontSize = "2rem"; // Efeito de suspense

            // Gira entre 5 e 8 voltas completas + ângulo aleatório
            const extraSpins = 1800 + Math.floor(Math.random() * 720);
            currentRotation += extraSpins;
            
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            // Aguarda a transição CSS do giro (3s)
            setTimeout(() => {
                const randomWord = gospelWords[Math.floor(Math.random() * gospelWords.length)];
                wordEl.textContent = randomWord;
                wordEl.style.fontSize = "1.2rem";
                isSpinning = false;
                btn.disabled = false;
            }, 3000);
        }

        // --- LÓGICA DAS MÍMICAS (JOGO 2) ---
        const mimicList = [
            "Arca de Noé", "Davi e Golias", "Moisés abrindo o Mar",
            "A Queda de Jericó", "Daniel nos Leões", "A Pesca Maravilhosa",
            "O Filho Pródigo", "Zaqueu na Árvore", "A Torre de Babel",
            "Multiplicação dos Pães", "Sansão e as Colunas", "O Bom Samaritano"
        ];

        let timerInterval = null;
        let timeLeft = 60;
        let score = 0;
        let isPaused = false;

        function startNewMimic() {
            clearInterval(timerInterval);
            timeLeft = 60;
            isPaused = false;
            updateTimerDisplay();
            
            // Ativa os botões
            document.getElementById('btnHit').disabled = false;
            document.getElementById('btnPass').disabled = false;
            
            const pauseBtn = document.getElementById('pauseBtn');
            pauseBtn.style.display = 'block';
            pauseBtn.textContent = 'Pausar Tempo ⏸️';

            setRandomMimicWord();
            runTimer();
        }

        function setRandomMimicWord() {
            const randomMimic = mimicList[Math.floor(Math.random() * mimicList.length)];
            document.getElementById('secretWord').textContent = randomMimic;
        }

        function runTimer() {
            timerInterval = setInterval(() => {
                if(!isPaused) {
                    timeLeft--;
                    updateTimerDisplay();
                    
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        document.getElementById('secretWord').textContent = "TEMPO ESGOTADO! ⏳";
                        document.getElementById('btnHit').disabled = true;
                        document.getElementById('btnPass').disabled = true;
                        document.getElementById('pauseBtn').style.display = 'none';
                    }
                }
            }, 1000);
        }

        function togglePause() {
            isPaused = !isPaused;
            const pauseBtn = document.getElementById('pauseBtn');
            pauseBtn.textContent = isPaused ? 'Continuar ▶️' : 'Pausar Tempo ⏸️';
            pauseBtn.className = isPaused ? 'btn btn-primary full-width' : 'btn btn-warning full-width';
        }

        function adjustScore(amount) {
            if (amount > 0) {
                score += amount;
                document.getElementById('scoreVal').textContent = score;
            }
            // Sorteia nova palavra, mas o tempo continua rolando
            setRandomMimicWord();
        }

        function updateTimerDisplay() {
            document.getElementById('timer').textContent = timeLeft;
        }
    </script>
</body>
</html>
