<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arena</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --accent: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 1rem;
            width: 100%;
            max-width: 500px;
        }

        h1 {
            font-size: 2rem;
            background: linear-gradient(to right, #c084fc, #f43f5e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 0.5rem;
        }

        /* --- ABAS --- */
        .nav-tabs {
            display: flex;
            gap: 0.5rem;
            width: 100%;
            max-width: 500px;
            margin-bottom: 1rem;
            background: var(--bg-card);
            padding: 0.35rem;
            border-radius: 12px;
        }

        .tab-btn {
            flex: 1;
            padding: 0.75rem;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.9rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .tab-btn.active {
            background: var(--accent);
            color: white;
        }

        .game-container {
            display: none;
            width: 100%;
            max-width: 500px;
            background: var(--bg-card);
            border-radius: 16px;
            padding: 1.25rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            animation: fadeIn 0.3s ease;
        }

        .game-container.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- CONTROLES E INPUTS --- */
        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .custom-select {
            width: 100%;
            padding: 0.8rem;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.3);
            color: white;
            font-size: 0.9rem;
            outline: none;
            appearance: none;
        }

        .players-setup-area {
            background: rgba(0,0,0,0.15);
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            border: 1px dashed rgba(255,255,255,0.1);
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        
        .input-group input {
            flex: 1;
            padding: 0.9rem;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.3);
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .players-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .player-badge {
            background: rgba(139, 92, 246, 0.2);
            border: 1px solid var(--accent);
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .remove-btn {
            background: none;
            border: none;
            color: var(--danger);
            font-weight: bold;
            cursor: pointer;
        }

        .round-info {
            text-align: center;
            font-size: 0.9rem;
            color: var(--warning);
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .round-actions {
            background: rgba(0,0,0,0.2);
            padding: 1rem;
            border-radius: 12px;
            margin-top: 1rem;
            animation: fadeIn 0.3s ease;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 0.6rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 1rem;
        }
        .leaderboard-item:last-child { border-bottom: none; }

        /* --- ROLETA VISUAL --- */
        .roulette-wrapper {
            position: relative;
            width: 240px;
            height: 240px;
            margin: 0 auto 1.5rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .roulette-pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-bottom: 20px solid #f43f5e;
            z-index: 10;
        }

        .roulette-wheel {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                #8b5cf6 0deg 60deg,
                #6d28d9 60deg 120deg,
                #f43f5e 120deg 180deg,
                #be123c 180deg 240deg,
                #38bdf8 240deg 300deg,
                #0369a1 300deg 360deg
            );
            transition: transform 3s cubic-bezier(0.15, 0.90, 0.15, 1);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
        }

        .roulette-center {
            position: relative;
            z-index: 5;
            width: 150px;
            height: 150px;
            background: var(--bg-primary);
            border: 4px solid var(--bg-card);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .word-display {
            font-size: 1.2rem;
            font-weight: 700;
            text-align: center;
            padding: 0.5rem;
            color: #fff;
            word-wrap: break-word;
        }

        /* --- BOTÕES GERAIS --- */
        .btn {
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.1s;
            margin-top: 0.5rem;
        }
        
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: var(--accent); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-warning { background: var(--warning); color: #000; }
        .btn-outline { background: transparent; border: 1px solid var(--danger); color: var(--danger); }

        /* --- TEMPORIZADORES --- */
        .timer-display {
            font-size: 3rem;
            font-weight: 800;
            text-align: center;
            color: #f43f5e;
            margin: 0.5rem 0;
            font-variant-numeric: tabular-nums;
        }

        .timer-game1 { display: none; margin-bottom: 0.5rem; }

        .secret-word {
            font-size: 1.5rem;
            font-weight: 700;
            color: #38bdf8;
            text-align: center;
            margin: 1.5rem 0;
            min-height: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }
        
        .full-width { grid-column: span 2; }

        .score-board {
            display: flex;
            flex-direction: column;
            background: rgba(0,0,0,0.2);
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
        }
        
        .winner-msg {
            color: var(--success);
            font-size: 1.2rem;
            text-align: center;
            font-weight: bold;
            margin: 1rem 0;
            animation: fadeIn 0.5s ease;
        }
    </style>
</head>
<body onload="initGame()">

    <header>
        <h1>🎮 Arena</h1>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab(0)">1 Palavra, 1 Música</button>
        <button class="tab-btn" onclick="switchTab(1)">Mímicas</button>
    </div>

    <div class="game-container active" id="game-1">
        
        <div class="players-setup-area">
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.8rem;">⚙️ Configurações da Partida (Salvo auto)</p>
            
            <div class="settings-grid">
                <select id="gameCategory" class="custom-select">
                    <option value="gospel">Cat: Gospel (150+ pal)</option>
                    <option value="mpb">Cat: MPB & Pop/Rock</option>
                </select>
                
                <select id="maxRounds" class="custom-select" onchange="updateRoundInfo()">
                    <option value="5">5 Rodadas</option>
                    <option value="10" selected>10 Rodadas</option>
                    <option value="15">15 Rodadas</option>
                    <option value="20">20 Rodadas</option>
                    <option value="999">Infinito</option>
                </select>
            </div>

            <div class="input-group">
                <input type="text" id="playerName" placeholder="Nome do Jogador/Equipe" onkeypress="handleEnter(event)">
                <button class="btn btn-primary" style="width: auto; margin-top:0; padding: 0 1.5rem;" onclick="addPlayer()">Add</button>
            </div>
            <div class="players-list" id="playersList"></div>
            
            <button class="btn btn-outline" style="padding: 0.5rem; font-size: 0.85rem;" onclick="resetGame()">Zerar Tudo 🗑️</button>
        </div>
        
        <div class="round-info" id="roundDisplay">Rodada: 1 de 10</div>

        <div class="roulette-wrapper" id="rouletteArea">
            <div class="roulette-pointer"></div>
            <div class="roulette-wheel" id="wheel"></div>
            <div class="roulette-center">
                <div class="word-display" id="currentWord">Gire!</div>
            </div>
        </div>

        <div class="timer-display timer-game1" id="timerGame1">30</div>

        <div id="winnerDisplay" style="display:none;" class="winner-msg"></div>

        <button class="btn btn-primary" id="spinBtn" onclick="spinRoulette()">Girar Roleta 🎯</button>

        <div id="roundActions" class="round-actions" style="display:none;">
            <p id="questionText" style="text-align:center; color:var(--text-muted); margin-bottom:0.8rem; font-size: 0.9rem;">Quem cantou primeiro?</p>
            <div class="controls-grid" id="awardButtonsGrid"></div>
            <button class="btn btn-danger" style="margin-top:0.5rem; width: 100%;" onclick="passRound()">Ninguém Acertou (Passar) ❌</button>
        </div>

        <div class="score-board">
            <h4 style="margin-bottom:0.5rem; text-align:center; color: var(--accent);">🏆 Placar</h4>
            <div id="leaderboardGame1"></div>
        </div>

    </div>

    <div class="game-container" id="game-2">
        
        <div class="settings-grid" style="margin-bottom: 1.5rem;">
            <select id="mimicTheme" class="custom-select full-width">
                <option value="all">Mímicas: Todas as Categorias</option>
                <option value="actions">Ações do Dia a Dia</option>
                <option value="animals">Animais</option>
                <option value="movies">Filmes e Personagens</option>
                <option value="professions">Profissões</option>
            </select>
        </div>

        <div class="timer-display" id="timerGame2">60</div>
        <div class="secret-word" id="secretWord">Clique em Iniciar</div>

        <div class="controls-grid" style="margin-top: 1rem;">
            <button class="btn btn-primary full-width" style="margin-top:0;" id="startMimicBtn" onclick="startNewMimic()">Sortear / Iniciar 🎭</button>
            <button class="btn btn-warning full-width" id="pauseBtn" onclick="togglePause()" style="display: none; margin-top:0;">Pausar Tempo ⏸️</button>
            
            <button class="btn btn-success" id="btnHit" onclick="adjustScore2(1)" disabled>Acertou ✅</button>
            <button class="btn btn-danger" id="btnPass" onclick="adjustScore2(0)" disabled>Passar ❌</button>
        </div>

        <div class="score-board" style="flex-direction: row; justify-content: space-between; align-items: center;">
            <span>Acertos da Rodada:</span>
            <strong id="scoreVal2" style="color: #fff; font-size: 1.1rem;">0</strong>
        </div>
    </div>

    <script>
        // --- NAVEGAÇÃO DE ABAS ---
        function switchTab(index) {
            document.querySelectorAll('.game-container').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });
            document.querySelectorAll('.tab-btn').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });
        }

        // ==========================================
        // LÓGICA DO JOGO 1: ROLETA E PLACAR SALVO
        // ==========================================
        
        // Categoria 1: Gospel (+150 palavras)
        const gospelWords = [
            "Deus", "Jesus", "Espírito", "Santo", "Cruz", "Sangue", "Cordeiro", "Leão", 
            "Altar", "Fogo", "Glória", "Graça", "Milagre", "Promessa", "Deserto", 
            "Vitória", "Amor", "Paz", "Luz", "Caminho", "Verdade", "Vida", "Perdão", 
            "Céu", "Rei", "Senhor", "Fé", "Esperança", "Salvação", "Justiça", 
            "Misericórdia", "Presença", "Unção", "Poder", "Força", "Alegria", "Tristeza", 
            "Choro", "Madrugada", "Oração", "Jejum", "Palavra", "Água", "Vento", 
            "Mar", "Muralha", "Jericó", "Jordão", "Trono", "Coroa", "Vale", "Monte", 
            "Rocha", "Escudo", "Espada", "Exército", "Batalha", "Guerra", "Louvor", 
            "Adoração", "Cântico", "Novo", "Eterno", "Soberano", "Redentor", "Filho", 
            "Pai", "Igreja", "Noiva", "Vaso", "Oleiro", "Barro", "Quebrantado", 
            "Coração", "Alma", "Mente", "Corpo", "Templo", "Morada", "Esconderijo", 
            "Refúgio", "Socorro", "Angústia", "Tempestade", "Barco", "Ondas", 
            "Calmaria", "Mão", "Abraço", "Voz", "Chamado", "Escolha", "Propósito", 
            "Missão", "Semente", "Fruto", "Colheita", "Trigo", "Celeiro", "Maná", 
            "Pão", "Vinho", "Azeite", "Cálice", "Incenso", "Arca", "Cajado", "Funda", 
            "Gigante", "Fornalha", "Cova", "Cego", "Mudo", "Surdo", "Ressurreição", 
            "Túmulo", "Pedra", "Véu", "Tabernáculo", "Sacerdote", "Profeta", "Anjo", 
            "Querubim", "Serafim", "Trombeta", "Harpa", "Tamborim", "Dança", "Festa", 
            "Banquete", "Vestes", "Linho", "Branco", "Calvário", "Getsêmani", "Sião", 
            "Egito", "Canaã", "Leite", "Mel", "Ovelha", "Pastor", "Aprisco", "Águia", 
            "Pomba", "Peixe", "Rede", "Pescador", "Mestre", "Discípulo", "Prego", 
            "Espinho", "Lança", "Ascensão", "Nuvem", "Retorno", "Maranata"
        ];

        // Categoria 2: MPB & Pop/Rock
        const mpbWords = [
            "Amor", "Saudade", "Tempo", "Vida", "Mundo", "Sol", "Chuva", "Mar", "Vento", 
            "Céu", "Estrela", "Noite", "Dia", "Beijo", "Abraço", "Coração", "Olhar", 
            "Sorriso", "Menina", "Menino", "Flor", "Estrada", "Caminho", "Cidade", 
            "Solidão", "Festa", "Dança", "Música", "Voz", "Silêncio", "Loucura", 
            "Razão", "Paixão", "Desejo", "Medo", "Coragem", "Sonho", "Realidade", 
            "Lembrança", "Esquecimento", "Janela", "Porta", "Rua", "Esquina", "Bar", 
            "Copo", "Fogo", "Água", "Beleza", "Destino", "Sorte"
        ];
        
        let players = [];
        let isSpinning = false;
        let currentRotation = 0;
        let timerGame1Interval = null;
        let currentRound = 1;

        // --- Inicialização (Carrega do LocalStorage) ---
        function initGame() {
            const savedPlayers = localStorage.getItem('arenaPlayers');
            const savedRound = localStorage.getItem('arenaRound');
            
            if(savedPlayers) players = JSON.parse(savedPlayers);
            if(savedRound) currentRound = parseInt(savedRound);
            
            renderPlayers();
            updateRoundInfo();
        }

        function saveState() {
            localStorage.setItem('arenaPlayers', JSON.stringify(players));
            localStorage.setItem('arenaRound', currentRound.toString());
        }

        function resetGame() {
            if(confirm("Tem certeza que deseja zerar os jogadores e o placar?")) {
                players = [];
                currentRound = 1;
                localStorage.removeItem('arenaPlayers');
                localStorage.removeItem('arenaRound');
                document.getElementById('winnerDisplay').style.display = 'none';
                document.getElementById('rouletteArea').style.display = 'flex';
                document.getElementById('spinBtn').style.display = 'block';
                document.getElementById('currentWord').textContent = "Gire!";
                renderPlayers();
                updateRoundInfo();
            }
        }

        function handleEnter(e) { if (e.key === 'Enter') addPlayer(); }

        function addPlayer() {
            const input = document.getElementById('playerName');
            const name = input.value.trim();
            if (name && !players.find(p => p.name.toLowerCase() === name.toLowerCase())) {
                players.push({ name: name, score: 0 });
                input.value = '';
                saveState();
                renderPlayers();
            }
        }

        function removePlayer(index) {
            players.splice(index, 1);
            saveState();
            renderPlayers();
        }

        function renderPlayers() {
            const list = document.getElementById('playersList');
            list.innerHTML = '';
            players.forEach((p, index) => {
                list.innerHTML += `
                    <div class="player-badge">
                        ${p.name}
                        <button class="remove-btn" onclick="removePlayer(${index})">✕</button>
                    </div>
                `;
            });
            updateLeaderboard();
        }

        function updateRoundInfo() {
            const max = document.getElementById('maxRounds').value;
            const display = document.getElementById('roundDisplay');
            
            if(max === "999") {
                display.textContent = `Rodada Livre: ${currentRound}`;
            } else {
                display.textContent = `Rodada: ${currentRound} de ${max}`;
            }
        }

        function spinRoulette() {
            if (isSpinning) return;
            isSpinning = true;
            
            const wheel = document.getElementById('wheel');
            const wordEl = document.getElementById('currentWord');
            const btnSpin = document.getElementById('spinBtn');
            const timerEl = document.getElementById('timerGame1');
            const actionsEl = document.getElementById('roundActions');
            const category = document.getElementById('gameCategory').value;
            
            clearInterval(timerGame1Interval);
            timerEl.style.display = 'none';
            actionsEl.style.display = 'none';
            btnSpin.style.display = 'block';
            btnSpin.disabled = true;
            
            wordEl.textContent = "...";
            wordEl.style.fontSize = "2rem";

            const extraSpins = 1800 + Math.floor(Math.random() * 720);
            currentRotation += extraSpins;
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                const wordList = category === 'gospel' ? gospelWords : mpbWords;
                const randomWord = wordList[Math.floor(Math.random() * wordList.length)];
                
                wordEl.textContent = randomWord;
                wordEl.style.fontSize = "1.2rem";
                isSpinning = false;
                
                btnSpin.style.display = 'none';
                btnSpin.disabled = false;
                showRoundActions(); 
                startTimerGame1(); 
            }, 3000);
        }

        function startTimerGame1() {
            const timerEl = document.getElementById('timerGame1');
            let timeLeft = 30;
            timerEl.style.display = 'block';
            timerEl.textContent = timeLeft;
            timerEl.style.fontSize = '3rem';
            
            timerGame1Interval = setInterval(() => {
                timeLeft--;
                timerEl.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerGame1Interval);
                    timerEl.textContent = "TEMPO ESGOTADO! ⏳";
                    timerEl.style.fontSize = '2rem';
                }
            }, 1000);
        }

        function showRoundActions() {
            const actionsEl = document.getElementById('roundActions');
            const grid = document.getElementById('awardButtonsGrid');
            const questionText = document.getElementById('questionText');
            
            grid.innerHTML = '';
            
            if (players.length === 0) {
                questionText.textContent = "Adicione jogadores para marcar pontos!";
            } else {
                questionText.textContent = "Quem cantou primeiro?";
                players.forEach((p, index) => {
                    grid.innerHTML += `
                        <button class="btn btn-success" style="margin-top:0;" onclick="awardPoint(${index})">
                            ${p.name} ✅
                        </button>
                    `;
                });
                
                if(players.length % 2 !== 0 && players.length > 1) {
                    grid.lastElementChild.classList.add('full-width');
                } else if (players.length === 1) {
                    grid.lastElementChild.classList.add('full-width');
                }
            }
            actionsEl.style.display = 'block';
        }

        function awardPoint(playerIndex) {
            players[playerIndex].score += 1;
            saveState();
            endRound();
        }

        function passRound() { 
            endRound(); 
        }

        function endRound() {
            clearInterval(timerGame1Interval);
            document.getElementById('timerGame1').style.display = 'none';
            document.getElementById('roundActions').style.display = 'none';
            
            currentRound++;
            saveState();
            updateRoundInfo();
            updateLeaderboard();

            const max = parseInt(document.getElementById('maxRounds').value);
            
            // Verifica se o jogo acabou
            if(currentRound > max) {
                document.getElementById('rouletteArea').style.display = 'none';
                
                const sortedPlayers = [...players].sort((a, b) => b.score - a.score);
                const winnerText = sortedPlayers.length > 0 ? `Vencedor(a): ${sortedPlayers[0].name} 🏆` : "Fim de Jogo!";
                
                const winDiv = document.getElementById('winnerDisplay');
                winDiv.textContent = winnerText;
                winDiv.style.display = 'block';
                
            } else {
                document.getElementById('spinBtn').style.display = 'block';
                document.getElementById('currentWord').textContent = "Próxima!";
            }
        }

        function updateLeaderboard() {
            const board = document.getElementById('leaderboardGame1');
            if(players.length === 0) {
                board.innerHTML = `<p style="text-align:center; color: var(--text-muted); font-size: 0.85rem; margin-top: 0.5rem;">Adicione jogadores para iniciar o placar.</p>`;
                return;
            }
            board.innerHTML = '';
            const sortedPlayers = [...players].sort((a, b) => b.score - a.score);
            sortedPlayers.forEach(p => {
                board.innerHTML += `
                    <div class="leaderboard-item">
                        <strong>${p.name}</strong>
                        <span>${p.score} pts</span>
                    </div>
                `;
            });
        }


        // ==========================================
        // LÓGICA DO JOGO 2: MÍMICAS COM TEMAS
        // ==========================================
        const mimicDB = {
            actions: ["Escovar os dentes", "Tomar banho", "Cozinhar", "Dirigir", "Dormir", "Chorar", "Rir", "Ler um livro", "Escrever", "Tocar bateria", "Cantar", "Andar de bicicleta", "Fazer compras", "Varrer a casa", "Lavar louça"],
            animals: ["Leão", "Gato", "Cachorro", "Macaco", "Elefante", "Cobra", "Pinguim", "Sapo", "Cavalo", "Pássaro", "Jacaré", "Tubarão", "Baleia", "Galinha", "Porco", "Canguru"],
            movies: ["Homem-Aranha", "Harry Potter", "Titanic", "Matrix", "Star Wars", "O Rei Leão", "Jurassic Park", "Batman", "Vingadores", "Shrek", "Minions", "E.T.", "Senhor dos Anéis"],
            professions: ["Médico", "Professor", "Policial", "Bombeiro", "Cantor", "Astronauta", "Pintor", "Cozinheiro", "Pescador", "Fotógrafo", "Motorista", "Dançarino", "Jogador de Futebol", "Juiz"]
        };

        let timerGame2Interval = null;
        let timeLeftGame2 = 60;
        let score2 = 0;
        let isPaused2 = false;

        function startNewMimic() {
            clearInterval(timerGame2Interval);
            timeLeftGame2 = 60;
            isPaused2 = false;
            
            score2 = 0;
            document.getElementById('scoreVal2').textContent = score2;
            updateTimer2Display();
            
            document.getElementById('btnHit').disabled = false;
            document.getElementById('btnPass').disabled = false;
            
            const pauseBtn = document.getElementById('pauseBtn');
            pauseBtn.style.display = 'block';
            pauseBtn.textContent = 'Pausar Tempo ⏸️';
            pauseBtn.className = 'btn btn-warning full-width';

            setRandomMimicWord();
            runTimer2();
        }

        function setRandomMimicWord() {
            const theme = document.getElementById('mimicTheme').value;
            let wordList = [];
            
            if(theme === 'all') {
                wordList = [...mimicDB.actions, ...mimicDB.animals, ...mimicDB.movies, ...mimicDB.professions];
            } else {
                wordList = mimicDB[theme];
            }

            const randomMimic = wordList[Math.floor(Math.random() * wordList.length)];
            document.getElementById('secretWord').textContent = randomMimic;
        }

        function runTimer2() {
            timerGame2Interval = setInterval(() => {
                if(!isPaused2) {
                    timeLeftGame2--;
                    updateTimer2Display();
                    if (timeLeftGame2 <= 0) {
                        clearInterval(timerGame2Interval);
                        document.getElementById('secretWord').textContent = "TEMPO ESGOTADO! ⏳";
                        document.getElementById('btnHit').disabled = true;
                        document.getElementById('btnPass').disabled = true;
                        document.getElementById('pauseBtn').style.display = 'none';
                    }
                }
            }, 1000);
        }

        function togglePause() {
            isPaused2 = !isPaused2;
            const pauseBtn = document.getElementById('pauseBtn');
            pauseBtn.textContent = isPaused2 ? 'Continuar ▶️' : 'Pausar Tempo ⏸️';
            pauseBtn.className = isPaused2 ? 'btn btn-primary full-width' : 'btn btn-warning full-width';
        }

        function adjustScore2(amount) {
            if (amount > 0) {
                score2 += amount;
                document.getElementById('scoreVal2').textContent = score2;
            }
            setRandomMimicWord();
        }

        function updateTimer2Display() {
            document.getElementById('timerGame2').textContent = timeLeftGame2;
        }
    </script>
</body>
</html>
